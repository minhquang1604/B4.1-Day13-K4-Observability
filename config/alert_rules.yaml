alerts:
  - name: ai-api-tail-latency-slo-breach
    severity: critical
    condition: P95(response_sent.latency_ms) > 3000 ms for 10 minutes
    type: symptom-based
    owner: Hùng (SRE)
    runbook: docs/alerts.md#alert-1
  - name: ai-api-error-rate-slo-breach
    severity: critical
    condition: count(request_failed) / count(request_received) * 100 > 2% for 5 minutes
    type: symptom-based
    owner: Hùng (SRE)
    runbook: docs/alerts.md#alert-2
  - name: ai-api-daily-cost-budget-breach
    severity: warning
    condition: sum(response_sent.cost_usd) > 2.5 USD in a rolling 24-hour window
    type: symptom-based
    owner: Hùng (SRE)
    runbook: docs/alerts.md#alert-3
